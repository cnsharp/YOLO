# 插件版本号的唯一来源：喂给 project.version（决定产物文件名）和 plugin.xml 的 <version>
pluginVersion=0.1.0
# 复用本机 IDEA 自带的 JetBrains Runtime (JDK 25) 作为构建工具链，避免联网下载 JDK
org.gradle.java.installations.paths=/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home
# IntelliJ Platform 已自带 kotlin-stdlib，不要把运行时打进插件包（否则体积膨胀近 2MB）
kotlin.stdlib.default.dependency=false

