# The single source of truth for the plugin version: feeds project.version (sets the artifact
# filename) and plugin.xml's <version>.
pluginVersion=0.3.0
# Reuse the IDEA-bundled JetBrains Runtime (JDK 25) as the build toolchain to avoid downloading
# a JDK over the network.
org.gradle.java.installations.paths=/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home
# Disable Gradle's auto-detection of system JDKs; otherwise it scans every JDK under
# /Library/Java/JavaVirtualMachines/ and can break the instrumentCode task.
# With this off, Gradle only uses the explicitly listed JBR 25 above.
org.gradle.java.installations.auto-detect=false
# The IntelliJ Platform already ships kotlin-stdlib, so don't bundle it into the plugin
# (otherwise the artifact bloats by ~2MB).
kotlin.stdlib.default.dependency=false
# The IntelliJ Platform Gradle plugin's self-update check queries JetBrains for the latest plugin
# version at the start of every build. Offline (no network) that lookup fails with a
# "Connection refused" error on :initializeIntelliJPlatformPlugin. Turn it off to build without connectivity.
org.jetbrains.intellij.platform.selfUpdateCheck=false
