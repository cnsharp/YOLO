name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    name: Build and publish to GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 25: Gradle 9.1.0's bundled Kotlin DSL parses Temurin's "25.0.3" version
      # string correctly (Gradle 8.14.5 threw IllegalArgumentException in JavaVersion.parse).
      # The plugin's own sources also target JDK 25 via jvmToolchain(25) in build.gradle.kts.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin distribution
        env:
          CI: "true"   # build.gradle.kts uses this to download IntelliJ Platform instead of a local install
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin -PpluginVersion="${GITHUB_REF_NAME#v}" --info --stacktrace

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/yolo-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
