settings.agents.help=An agent whose icon / name is shown in full color is installed on PATH and appears in the YOLO panel; a greyed-out entry means it is not installed. \u201CIcon\u201D shows the bundled icon for promoted agents, or your icon / the default lightning for custom tools. \u201CSkip flag\u201D is the permission-bypass argument (e.g. --dangerously-skip-permissions or -y) appended when the YOLO panel\u2019s \u201CSkip permissions\u201D toggle is on.

