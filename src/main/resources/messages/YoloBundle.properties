# Default (English) bundle for YOLO: AI Agents Extender.
# Any key missing from a translated bundle falls back to the value here.

# ---------------------------------------------------------------------------
# Product name - the SINGLE source of truth for the display name.
# Referenced from Kotlin via Yolo.NAME, and from plugin.xml via <resource-bundle>.
# Not translated: it is the brand.
plugin.name=YOLO: AI Agents Extender
# ---------------------------------------------------------------------------

# Action text/description are resolved by the platform from the action id.
action.com.cnsharp.yolo.SkipPermissionsAction.text=YOLO(Skip Permissions)
action.com.cnsharp.yolo.SkipPermissionsAction.description=Launch the next AI agent with its skip-permissions flag
action.com.cnsharp.yolo.OpenSettingsAction.text=YOLO Settings
action.com.cnsharp.yolo.OpenSettingsAction.description=Configure agents, skip flags and icons

settings.agents.label=Agents (built-in + custom):
settings.agents.help=Built-in agents are listed by IDEA dynamically; an agent whose icon is shown in full color is installed on PATH and appears in the terminal \u201CAI Agents\u201D dropdown, a greyed-out icon means it is not installed. \u201CIcon\u201D shows IDEA\u2019s icon for built-in agents, or your icon / the default lightning for custom tools. \u201CSkip flag\u201D is the permission-bypass argument (e.g. --dangerously-skip-permissions or -y) injected when the terminal \u201CSkip permissions\u201D toggle is on.

