# Default (English) bundle for YOLO: AI Agents Extender.
# Any key missing from a translated bundle falls back to the value here.

# ---------------------------------------------------------------------------
# Product name - the SINGLE source of truth for the display name.
# Referenced from Kotlin via Yolo.NAME, and from plugin.xml via <resource-bundle>.
# Not translated: it is the brand.
plugin.name=YOLO: AI Agents Extender
# ---------------------------------------------------------------------------

